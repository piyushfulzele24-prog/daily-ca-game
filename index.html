<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily CA Challenge · SSC CGL</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f5f1;--card:#fff;--ink:#1d1d1b;--mute:#6b6a65;--line:#e2e0d8;--acc:#0f6e56;--ok:#1d9e75;--bad:#d85a30;--okbg:#e1f5ee;--badbg:#faece7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--card:#222221;--ink:#f0eee8;--mute:#9b9a94;--line:#363633;--acc:#5dcaa5;--ok:#5dcaa5;--bad:#f0997b;--okbg:#0b3a2d;--badbg:#472214}}
:root[data-theme="dark"]{--bg:#161615;--card:#222221;--ink:#f0eee8;--mute:#9b9a94;--line:#363633;--acc:#5dcaa5;--ok:#5dcaa5;--bad:#f0997b;--okbg:#0b3a2d;--badbg:#472214}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:520px;margin:0 auto;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:12px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:18px;margin:0 0 8px}
.mute{color:var(--mute);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:14px}
button{font:inherit;cursor:pointer;color:var(--ink)}
.btn{background:var(--acc);color:var(--bg);border:0;border-radius:12px;padding:14px;width:100%;font-weight:600;margin-top:8px}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.ic{background:none;border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-top:8px}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opt.gone{opacity:.25;pointer-events:none}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0 14px}
.bar i{display:block;height:100%;background:var(--acc);width:100%}
.exp{margin-top:12px;padding:12px;border-radius:12px;background:var(--bg);font-size:14px}
.big{font-size:44px;font-weight:700;line-height:1.1}
.tb{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;border-bottom:1px solid var(--line)}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><b>Daily CA Challenge</b><button class="ic" id="theme" aria-label="Toggle dark mode">◐</button></div>
  <div id="app"></div>
</div>
<script>
var PACK={qs:[]};
var $=function(i){return document.getElementById(i)},app=$("app"),mem={};
function ls(k,v){try{if(v===undefined){var r=localStorage.getItem(k);return r===null?mem[k]:JSON.parse(r)}localStorage.setItem(k,JSON.stringify(v))}catch(e){if(v===undefined)return mem[k];mem[k]=v}}
function ist(off){var d=new Date(Date.now()+(off||0)*864e5);return d.toLocaleDateString("en-CA",{timeZone:"Asia/Kolkata"})}
var today=ist(),G;
$("theme").onclick=function(){var r=document.documentElement,dark=r.dataset.theme==="dark"||(r.dataset.theme!=="light"&&matchMedia("(prefers-color-scheme:dark)").matches);r.dataset.theme=dark?"light":"dark"};
function home(){
  var st=ls("stats")||{streak:0,xp:0,last:"",ranked:""},mn=ls("mistakes")||[],done=st.ranked===today;
  app.innerHTML='<div class="card"><h1>Today’s Challenge</h1><div class="mute">'+new Date().toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long",year:"numeric",timeZone:"Asia/Kolkata"})+'</div><div class="row" style="margin-top:12px"><span class="pill">🔥 '+st.streak+'-day streak</span><span class="pill">⭐ '+st.xp+' XP</span><span class="pill">'+PACK.qs.length+' questions</span></div>'+
  '<button class="btn" id="go">'+(done?"Practice again (unranked)":"Start today’s challenge")+'</button>'+
  (mn.length?'<button class="btn alt" id="nb">Mistake notebook ('+mn.length+')</button>':'')+
  '<p class="mute">30 seconds per question · one 50-50 and one Skip per game · speed bonus under 10 seconds.</p></div>';
  $("go").onclick=function(){start(!done)};
  if(mn.length)$("nb").onclick=notebook;
}
function start(ranked){G={i:0,xp:0,ok:0,t0:Date.now(),ranked:ranked,ll:{f:1,s:1},res:[]};ask()}
function ask(){
  var q=PACK.qs[G.i],n=PACK.qs.length;clearInterval(G.tm);G.left=30;G.lock=false;G.qs=Date.now();
  app.innerHTML='<div class="card"><div class="row" style="justify-content:space-between"><span class="mute">Q'+(G.i+1)+' / '+n+' · '+q.topic+' · '+q.d+'</span><b id="tl">30s</b></div><div class="bar"><i id="tb"></i></div>'+
  '<h2>'+q.q+'</h2><div id="os">'+q.o.map(function(t,k){return'<button class="opt" data-k="'+k+'">'+"ABCD"[k]+'. '+t+'</button>'}).join("")+'</div>'+
  '<div class="row" style="margin-top:12px"><button class="ic" id="ff"'+(G.ll.f?"":" disabled")+'>50-50</button><button class="ic" id="sk"'+(G.ll.s?"":" disabled")+'>Skip</button></div><div id="fb"></div></div>';
  [].forEach.call(document.querySelectorAll(".opt"),function(b){b.onclick=function(){pick(+b.dataset.k)}});
  $("ff").onclick=function(){if(!G.ll.f||G.lock)return;G.ll.f=0;$("ff").disabled=true;var w=[];q.o.forEach(function(_,k){if(k!==q.a)w.push(k)});w.sort(function(){return Math.random()-.5});w.slice(0,2).forEach(function(k){document.querySelector('[data-k="'+k+'"]').classList.add("gone")})};
  $("sk").onclick=function(){if(!G.ll.s||G.lock)return;G.ll.s=0;G.res.push({topic:q.topic,ok:null});next()};
  G.tm=setInterval(function(){G.left--;$("tl").textContent=G.left+"s";$("tb").style.width=(G.left/30*100)+"%";if(G.left<=0)pick(-1)},1000);
}
function pick(k){
  if(G.lock)return;G.lock=true;clearInterval(G.tm);
  var q=PACK.qs[G.i],ok=k===q.a,secs=(Date.now()-G.qs)/1000,gain=0;
  if(ok){gain=10+(secs<=10?5:0);G.xp+=gain;G.ok++}else{var mn=ls("mistakes")||[];mn.push({q:q.q,a:q.o[q.a],e:q.e});ls("mistakes",mn.slice(-100))}
  G.res.push({topic:q.topic,ok:ok});
  [].forEach.call(document.querySelectorAll(".opt"),function(b){var j=+b.dataset.k;b.classList.add("gone");if(j===q.a){b.classList.remove("gone");b.classList.add("ok")}if(j===k&&!ok){b.classList.remove("gone");b.classList.add("bad")}});
  $("fb").innerHTML='<div class="exp"><b>'+(ok?"Correct! +"+gain+" XP":k<0?"Time’s up.":"Not quite.")+'</b><br>'+q.e+'<div class="mute" style="margin-top:6px">Source: '+q.s+'</div></div><button class="btn" id="nx">'+(G.i+1<PACK.qs.length?"Next":"See result")+'</button>';
  $("nx").onclick=next;
}
function next(){clearInterval(G.tm);G.i++;G.i<PACK.qs.length?ask():finish()}
function finish(){
  var n=PACK.qs.length,st=ls("stats")||{streak:0,xp:0,last:"",ranked:""},t=Math.round((Date.now()-G.t0)/1000);
  if(G.ranked){st.streak=st.last===ist(-1)?st.streak+1:(st.last===today?st.streak:1);st.last=today;st.ranked=today}
  st.xp+=G.xp;ls("stats",st);
  var by={};G.res.forEach(function(r){by[r.topic]=by[r.topic]||[0,0];by[r.topic][1]++;if(r.ok)by[r.topic][0]++});
  var weak=Object.keys(by).filter(function(k){return by[k][0]<by[k][1]}).join(", ");
  app.innerHTML='<div class="card"><div class="mute">'+(G.ranked?"Ranked attempt":"Practice attempt")+'</div><div class="big">'+G.ok+' / '+n+'</div><div class="mute">Accuracy '+Math.round(G.ok/n*100)+'% · '+t+'s · +'+G.xp+' XP</div>'+
  '<h2 style="margin-top:16px">Topic breakdown</h2>'+Object.keys(by).map(function(k){return'<div class="tb"><span>'+k+'</span><span>'+by[k][0]+'/'+by[k][1]+'</span></div>'}).join("")+
  '<p><b>Weak areas:</b> '+(weak||"None, great work!")+'</p><button class="btn" id="hm">Back home</button></div>';
  $("hm").onclick=home;
}
function notebook(){
  var mn=ls("mistakes")||[];
  app.innerHTML='<div class="card"><h2>Mistake notebook</h2>'+mn.slice().reverse().map(function(m){return'<div class="exp" style="margin-bottom:8px"><b>'+m.q+'</b><br>Answer: '+m.a+'<br><span class="mute">'+m.e+'</span></div>'}).join("")+'<button class="btn alt" id="cl">Clear notebook</button><button class="btn" id="hm">Back home</button></div>';
  $("cl").onclick=function(){ls("mistakes",[]);home()};$("hm").onclick=home;
}
function ok(r){if(!r.ok)throw 0;return r.json()}
function load(){fetch("questions/"+today+".json").then(ok).catch(function(){return fetch("questions/latest.json").then(ok)}).then(function(p){PACK=p;home()}).catch(function(){app.innerHTML='<div class="card"><h2>Today’s questions aren’t ready yet</h2><p class="mute">Please check back shortly.</p></div>'})}
load();
</script>
</body>
</html>
